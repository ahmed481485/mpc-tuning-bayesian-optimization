[project]
name = "mpc-tuning-bayesian-optimization"
version = "1.0.0"
description = "Tuning the cost weights of a nonlinear MPC for pendulum swing-up with Bayesian optimisation (B.Sc. thesis, TU Darmstadt)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ahmed Salah" }]
requires-python = ">=3.12"
dependencies = [
    "botorch>=0.16.1",
    "casadi>=3.7.2",
    "do-mpc>=5.1.1",
    "gpytorch>=1.14.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "scipy>=1.16.3",
    "torch>=2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pendulum_mpc_bo"]
